suite: settings management
templates:
  - settings-secret.yaml
  - settings-configmap.yaml
  - statefulset.yaml
tests:
  - it: does not render settings secret or configmap in ui mode
    set:
      settings.management: ui
    asserts:
      - hasDocuments:
          count: 0
        template: settings-secret.yaml
      - hasDocuments:
          count: 0
        template: settings-configmap.yaml
      - notContains:
          content: apply-settings
        template: statefulset.yaml

  - it: renders settings secret, defaults configmap and init container in helm mode
    set:
      settings.management: helm
      settings.data.main.applicationTitle: CustomSeerr
    asserts:
      - isKind:
          of: Secret
        template: settings-secret.yaml
      - matchRegex:
          pattern: "CustomSeerr"
        template: settings-secret.yaml
      - isKind:
          of: ConfigMap
        template: settings-configmap.yaml
      - matchRegex:
          pattern: "merge-settings.js"
        template: settings-configmap.yaml
      - contains:
          content: apply-settings
        template: statefulset.yaml
      - contains:
          content: settings-defaults
        template: statefulset.yaml
      - contains:
          content: settings-overrides
        template: statefulset.yaml

  - it: uses existingSecret instead of chart secret in helm mode
    set:
      settings.management: helm
      settings.existingSecret: my-settings
    asserts:
      - hasDocuments:
          count: 0
        template: settings-secret.yaml
      - isKind:
          of: ConfigMap
        template: settings-configmap.yaml
      - contains:
          content: "secretName: my-settings"
        template: statefulset.yaml
      - contains:
          content: "key: settings.overrides.json"
        template: statefulset.yaml

  - it: uses a custom existingSecretKey when set
    set:
      settings.management: helm
      settings.existingSecret: my-settings
      settings.existingSecretKey: custom-settings.json
    asserts:
      - contains:
          content: "key: custom-settings.json"
        template: statefulset.yaml
