image:
  registry: ghcr.io
  repository: seerr-team/seerr
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ''
  # -- Image digest without the sha256: prefix (alias: digest).
  sha: ''
  # -- Image digest, with or without the sha256: prefix (Flux HelmRelease compatibility).
  digest: ''

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

# Liveness / Readiness / Startup Probes
probes:
  # -- Configure liveness probe
  livenessProbe:
    initialDelaySeconds: 20
    periodSeconds: 15
    timeoutSeconds: 3
    # successThreshold: 1
    # failureThreshold: 3
  # -- Configure readiness probe
  readinessProbe:
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 3
    # successThreshold: 1
    # failureThreshold: 3
  # -- Configure startup probe
  startupProbe: null
  #  tcpSocket:
  #    port: http

# -- Environment variables to add to the seerr pods
extraEnv: []
# -- Environment variables from secrets or configmaps to add to the seerr pods
extraEnvFrom: []

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials?
  automount: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # -- If not set and create is true, a name is generated using the fullname template
  name: ''

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  privileged: false
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 80
  annotations: {}

# -- Seerr settings.json management
settings:
  # -- How settings.json is managed. `ui`: app reads/writes on the config PVC (default).
  # `helm`: an init container deep-merges Helm-declared overrides onto the live
  # settings.json (or chart defaults, on first boot) on every pod start. Helm always
  # wins for keys it declares; anything else already on disk - Plex/Sonarr/Radarr
  # state discovered live, UI-only settings, etc. - is left untouched.
  management: ui
  # -- Use an existing Secret containing the settings overrides patch instead of
  # chart-rendered values. Only used when management is `helm`. The secret key
  # defaults to settings.overrides.json.
  existingSecret: ''
  existingSecretKey: settings.overrides.json
  # -- Partial settings overrides (AllSettings shape), deep-merged onto the live
  # settings.json (or bundled defaults on first boot). Only used when management
  # is `helm` and existingSecret is empty.
  # Example:
  #   data:
  #     public:
  #       initialized: true
  #     main:
  #       applicationTitle: Seerr
  #       applicationUrl: https://requests.example.com
  #     network:
  #       trustProxy: true
  #     jellyfin:
  #       ip: jellyfin.example.com
  #       port: 443
  #       useSsl: true
  #       apiKey: secret
  #     oidcLogin: true
  #     oidc:
  #       providers:
  #         - slug: pocketid
  #           name: Pocket ID
  #           issuerUrl: https://auth.example.com
  #           clientId: ""
  #           clientSecret: ""
  #           logo: ""
  #           newUserLogin: true
  data: {}
  # -- Inject sensitive settings from Kubernetes Secrets at render time (helm mode).
  # Avoids Flux valuesFrom targetPath into array fields (e.g. oidc.providers.0.clientId).
  # Requires Helm lookup (cluster access during install/upgrade).
  secretRefs: {}
  # -- Resources for the apply-settings init container (helm mode only).
  # This container runs the Seerr image's Node runtime to merge settings, so it
  # needs more headroom than the tiny volume-permissions busybox container.
  applyResources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # Example:
  #   secretRefs:
  #     clientId:
  #       secret: seerr-app-secrets
  #       key: client_id
  #     oidcClientId:
  #       secret: seerr-oidc
  #       key: client_id
  #     radarrApiKey:
  #       secret: servarr-api-keys
  #       key: radarr_api_key

# -- Creating PVC to store configuration
config:
  persistence:
    # -- Size of persistent disk
    size: 5Gi
    # -- Annotations for PVCs
    annotations: {}
    # -- Access modes of persistent disk
    accessModes:
      - ReadWriteOnce
    # -- Config name
    name: ''
    # -- Name of the permanent volume to reference in the claim.
    # Can be used to bind to existing volumes.
    volumeName: ''
    # -- Specify an existing `PersistentVolumeClaim` to use. If this value is provided, the default PVC will not be created
    existingClaim: ''
    # -- Subpath of the pvc which should be mounted
    subPath: ''
    # -- Storage class for the PVC. Set to "-" to disable dynamic provisioning. Uses default storage class if no value is provided
    storageClass: ''

ingress:
  enabled: false
  ingressClassName: ''
  annotations: {}
  #  kubernetes.io/ingress.class: nginx
  #  kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

route:
  main:
    # -- Enables or disables the Gateway API route
    enabled: false

    # -- Set the route apiVersion, e.g. gateway.networking.k8s.io/v1 or gateway.networking.k8s.io/v1alpha2
    apiVersion: gateway.networking.k8s.io/v1

    # -- Set the route kind.
    # Note that experimental kinds require changing `apiVersion`
    kind: HTTPRoute

    annotations: {}

    labels: {}

    parentRefs: []
    # - name: my-gateway
    #   namespace: gateway
    #   sectionName: https

    hostnames: []
    # - seerr.example.com

    additionalRules: []

    filters: []

    matches:
      - path:
          type: PathPrefix
          value: /

    # -- To redirect to HTTPS, create a new route object under the main route and enable this option.
    # This should only be used with HTTP-like routes, such as HTTPRoute or GRPCRoute.
    # [Reference]( https://gateway-api.sigs.k8s.io/guides/http-redirect-rewrite/ )
    httpsRedirect: false

resources: {}
# We usually recommend not to specify default resources and to leave this as a conscious
# choice for the user. This also increases chances charts run on environments with little
# resources, such as Minikube. If you do want to specify resources, uncomment the following
# lines, adjust them as necessary, and remove the curly braces after 'resources:'.
# limits:
#   cpu: 100m
#   memory: 128Mi
# requests:
#   cpu: 100m
#   memory: 128Mi

# -- Additional volumes on the output StatefulSet definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# -- Additional volumeMounts on the output StatefulSet definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# -- Init container that chowns the config volume (needed on some storage backends).
volumePermissions:
  enabled: false
  image:
    registry: docker.io
    repository: library/busybox
    tag: latest
    pullPolicy: IfNotPresent
    digest: ''
  command:
    - /bin/sh
    - -c
    - chown -R 1000:1000 /app/config
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# -- Additional init containers on the output StatefulSet definition.
extraInitContainers: []

nodeSelector: {}

tolerations: []

affinity: {}
